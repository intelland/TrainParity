[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainparity"
version = "0.1.0.dev1"
description = "Explicit differential tests for PyTorch training semantics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TrainParity contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
trainparity = "trainparity.cli:main"

[project.urls]
Repository = "https://github.com/intelland/TrainParity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainparity = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["trainparity"]
mypy_path = "src"
