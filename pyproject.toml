[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainparity"
version = "0.1.0"
description = "Explicit differential tests for PyTorch training semantics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{name = "Zhou Xianhao", email = "593403766@qq.com"}]
maintainers = [{name = "Zhou Xianhao", email = "593403766@qq.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = ["torch>=2.7,<2.14"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "numpy>=2.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.1",
]

[project.urls]
Repository = "https://github.com/intelland/TrainParity"
Documentation = "https://github.com/intelland/TrainParity/tree/main/docs"
Issues = "https://github.com/intelland/TrainParity/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["trainparity.examples*"]

[tool.setuptools.package-data]
trainparity = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/trainparity --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "src/trainparity/accumulation_worker.py",
  "src/trainparity/examples/*",
  "src/trainparity/protocols.py",
  "src/trainparity/prototypes.py",
  "src/trainparity/process_worker.py",
  "src/trainparity/worker.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["trainparity"]
mypy_path = "src"
