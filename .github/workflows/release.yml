name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainparity-pypi-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PYPI_ENVIRONMENT_PROTECTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/trainparity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve and validate release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          project_name="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['name'])")"
          expected_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [[ "${expected_version}" == *.dev* ]]; then
            echo "Refusing to publish development version ${expected_version}" >&2
            exit 1
          fi
          python - "${project_name}" "${expected_version}" <<'PY'
          from __future__ import annotations

          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import urlopen

          project_name, version = sys.argv[1:]
          url = f"https://pypi.org/pypi/{quote(project_name)}/{quote(version)}/json"
          try:
              with urlopen(url, timeout=15) as response:
                  status = response.status
          except HTTPError as error:
              if error.code == 404:
                  status = 404
              else:
                  raise SystemExit(
                      f"Refusing to publish: PyPI lookup failed with HTTP {error.code}"
                  ) from error
          except URLError as error:
              raise SystemExit(
                  f"Refusing to publish: PyPI lookup failed: {error.reason}"
              ) from error
          if status == 200:
              raise SystemExit(
                  f"Refusing to publish: {project_name} {version} already exists on PyPI"
              )
          if status != 404:
              raise SystemExit(
                  f"Refusing to publish: unexpected PyPI response {status}"
              )
          PY
          echo "expected_version=${expected_version}" >> "${GITHUB_OUTPUT}"
      - name: Build and validate distributions from the approved main commit
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > "${RUNNER_TEMP}/trainparity-dist.sha256"
      - name: Smoke-test the exact wheel from outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          expected_version="${{ steps.release-version.outputs.expected_version }}"
          smoke_env="${RUNNER_TEMP}/trainparity-release-smoke"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          "${smoke_env}/bin/python" -m pip install --no-deps "${wheels[0]}"
          export EXPECTED_TRAINPARITY_VERSION="${expected_version}"
          cd "${RUNNER_TEMP}"
          "${smoke_env}/bin/python" -c "import os, trainparity; from trainparity.api import MACHINE_REPORT_SCHEMA_VERSION; assert trainparity.__version__ == os.environ['EXPECTED_TRAINPARITY_VERSION']; assert MACHINE_REPORT_SCHEMA_VERSION == 2"
          "${smoke_env}/bin/python" -m trainparity.quickstarts.resume
          "${smoke_env}/bin/python" -m trainparity.quickstarts.accumulation
          "${smoke_env}/bin/python" -m trainparity.quickstarts.sample_coverage
          cd "${GITHUB_WORKSPACE}"
          sha256sum --check "${RUNNER_TEMP}/trainparity-dist.sha256"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
