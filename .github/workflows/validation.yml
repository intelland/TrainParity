name: Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.11 / PyTorch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.7.0", "2.10.0", "2.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the selected CPU PyTorch
        run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install the wheel without replacing PyTorch
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Run installed-package compatibility smoke outside the repository
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/compatibility_check.py" \
            --expected-torch "${{ matrix.torch }}" \
            --repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/compatibility-${{ matrix.torch }}.json"
