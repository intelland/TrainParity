name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
      - run: python scripts/verify_gate.py 3
      - name: Run pinned nanoGPT Gate 4 integration
        run: |
          mkdir -p "$RUNNER_TEMP/gate4/nanogpt"
          git -C "$RUNNER_TEMP/gate4/nanogpt" init
          git -C "$RUNNER_TEMP/gate4/nanogpt" remote add origin https://github.com/karpathy/nanoGPT.git
          git -C "$RUNNER_TEMP/gate4/nanogpt" fetch --depth 1 origin 3adf61e154c3fe3fca428ad6bc3818b27a3b8291
          git -C "$RUNNER_TEMP/gate4/nanogpt" checkout --detach FETCH_HEAD
          python -m experiments.gate4.run_matrix \
            --external-root "$RUNNER_TEMP/gate4" \
            --output "$RUNNER_TEMP/gate4-output/matrix.json" \
            --project nanogpt
      - run: python scripts/verify_gate.py 4
