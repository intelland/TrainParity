name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install current CPU PyTorch
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Run the complete README integration
        run: python -m pytest -q --no-cov examples/test_readme_case.py
      - name: Run every README quickstart command
        run: |
          python -m trainparity.quickstarts.resume
          python -m trainparity.quickstarts.accumulation
          python -m trainparity.quickstarts.sample_coverage
      - run: make build
      - name: Validate distribution metadata and rendered README
        run: python -m twine check dist/*
      - name: Verify release-surface contracts
        run: python scripts/verify_release_surface.py
